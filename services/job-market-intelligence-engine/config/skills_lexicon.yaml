# Skills searched for in job ads. Each ad counts a skill at most once, however often it is mentioned.
#
#   skill     the name shown in the skill profile
#   category  Technical | Tool | Domain knowledge | Soft skill | Language | Qualification
#   aliases   plain phrases, case-insensitive, matched as whole words
#             (spaces also match hyphens: "problem solving" finds "problem-solving")
#   patterns  (optional) regular expressions, for spellings the aliases can't express
#   sectors   (optional) only counted in ads from these sectors
#             ("networking" means building relationships in HR and sales ads)
#   ssk_id    the skill's ID in the Shared Skill Knowledge service; linked in step 7
#
# Notes: OCR misreads are added as aliases where they are common ("AIL" for "A/L").
# One-letter or everyday words (R, Go, Word, Access, Teams) are only matched in a longer phrase.

