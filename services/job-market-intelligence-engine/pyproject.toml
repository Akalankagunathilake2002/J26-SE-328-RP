[project]
name = "job-market-intelligence-engine"
version = "0.1.0"
description = "SkillBridge C01: collects Sri Lankan job ads responsibly and profiles the skills each job role demands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0.1",
    "rapidfuzz>=3.9",
    "pytesseract>=0.3.13",  # needs the Tesseract program: brew install tesseract
    "Pillow>=10.4",
    "fastapi>=0.115",  # the Market Pulse API (app/main.py)
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",  # FastAPI's test client
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
