# Local development stack. Run from the repository root:
#   docker compose -f infrastructure/docker-compose.yml up --build
#
# The API gateway (http://localhost:8080) is the only entry point to the backend services;
# the services themselves are not published on your machine.
#
# The default credentials and secret are for local development only. Override them with
# environment variables (or an infrastructure/.env file) anywhere else.

name: skill-bridge

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge}
      POSTGRES_DB: auth_db  # each service gets its own database; auth-service uses auth_db
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"  # host port for local tools (5432 is often taken)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ../services/auth-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillbridge}:${POSTGRES_PASSWORD:-skillbridge}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-0123456789}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: nginx:1.28-alpine
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service

volumes:
  postgres-data:
