# Local development stack. Run from the repository root:
#   docker compose -f infrastructure/docker-compose.yml up --build
#
# The API gateway (http://localhost:8080) is the only entry point to the backend services;
# the services themselves are not published on your machine.
#
# Ports, credentials and the token secret come from infrastructure/.env (copy .env.example and
# fill in the secrets). Compose stops with an error if a required secret is missing.

name: skill-bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
      POSTGRES_DB: auth_db # each service gets its own database; auth-service uses auth_db
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432" # only reachable from this computer
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d auth_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ../services/auth-service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillbridge}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/.env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    depends_on:
      postgres:
        condition: service_healthy

  shared-skill-knowledge:
    build: ../services/shared-skill-knowledge
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillbridge}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}@postgres:5432/ssks_db
      SHARED_SKILL_KNOWLEDGE_PORT: ${SHARED_SKILL_KNOWLEDGE_PORT:-8005}
    depends_on:
      postgres:
        condition: service_healthy

  job-market-intelligence-engine:
    build: ../services/job-market-intelligence-engine
    environment:
      JOB_MARKET_INTELLIGENCE_PORT: ${JOB_MARKET_INTELLIGENCE_PORT:-8003}
      SKILLBRIDGE_DATA_DIR: /service/data
    volumes:
      # Only the processed data (no personal details), read-only. Ads are collected on the host:
      # see services/job-market-intelligence-engine/README.md.
      - ../services/job-market-intelligence-engine/data/processed:/service/data/processed:ro

  learning-service:
    build: ../services/learning-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: learning_db
      LEARNING_SERVICE_PORT: ${LEARNING_SERVICE_PORT:?Set LEARNING_SERVICE_PORT in infrastructure/.env}
      SERVICE_PORT: ${LEARNING_SERVICE_PORT:?Set LEARNING_SERVICE_PORT in infrastructure/.env}
      # Key-free by default like the interview: answers from the local LLM on the host Mac
      # (Huggingbay/start-llm.sh, port 8082) and local embeddings in this container. Set
      # LEARNING_LLM_PROVIDER=gemini, LEARNING_EMBEDDING_PROVIDER=gemini and
      # LEARNING_EMBEDDING_DIMENSION=1536 to use Gemini (the corpus is re-ingested on restart).
      LLM_PROVIDER: ${LEARNING_LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:8082}
      LOCAL_LLM_TIMEOUT: 110                  # under the gateway's 120 s for /api/v1/learning/
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${LEARNING_EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIMENSION: ${LEARNING_EMBEDDING_DIMENSION:-384}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  interview-service:
    build: ../services/interview-service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: interview_db
      INTERVIEW_SERVICE_PORT: ${INTERVIEW_SERVICE_PORT:?Set INTERVIEW_SERVICE_PORT in infrastructure/.env}
      SERVICE_PORT: ${INTERVIEW_SERVICE_PORT:?Set INTERVIEW_SERVICE_PORT in infrastructure/.env}
      # The interview runs key-free by default: questions/evaluation from a local LLM on the host Mac
      # (Huggingbay/start-llm.sh, port 8082), local embeddings and local Whisper in this container.
      # Set INTERVIEW_LLM_PROVIDER=gemini (and INTERVIEW_EMBEDDING_PROVIDER=gemini with
      # INTERVIEW_EMBEDDING_DIMENSION=1536, then re-ingest) to use Gemini instead.
      LLM_PROVIDER: ${INTERVIEW_LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://host.docker.internal:8082}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${INTERVIEW_EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIMENSION: ${INTERVIEW_EMBEDDING_DIMENSION:-384}
      LIVEAVATAR_API_KEY: ${LIVEAVATAR_API_KEY:-}
      LIVEAVATAR_SANDBOX: ${LIVEAVATAR_SANDBOX:-true}
      LIVEAVATAR_AVATAR_ID: ${LIVEAVATAR_AVATAR_ID:-dd73ea75-1218-4ef3-92ce-606d5f7fbc0a}
      LIVEAVATAR_VOICE_ID: ${LIVEAVATAR_VOICE_ID:-}
      # Interviewer: "local" = LivePortrait + MuseTalk engine on the host Mac (Huggingbay/start-avatar.sh),
      # "liveavatar" = HeyGen, "none" = portrait + browser voice
      AVATAR_PROVIDER: ${AVATAR_PROVIDER:-local}
      LOCAL_AVATAR_URL: ${LOCAL_AVATAR_URL:-http://host.docker.internal:8768}
      LOCAL_AVATAR_NAME: ${LOCAL_AVATAR_NAME:-elena}
      LOCAL_AVATAR_VOICE: ${LOCAL_AVATAR_VOICE:-Samantha}
      LOCAL_AVATAR_DECODER: ${LOCAL_AVATAR_DECODER:-fast}
      # Candidate's spoken answers: "local" = faster-whisper in this container (no key);
      # "auto" = OpenAI Whisper if OPENAI_API_KEY is set, then local, then Gemini
      STT_PROVIDER: ${STT_PROVIDER:-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  readiness-engine:
    build: ../services/readiness-engine
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skillbridge}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}@postgres:5432/readiness_engine_db
      READINESS_ENGINE_PORT: ${READINESS_ENGINE_PORT:-8010}
      SSKS_BASE_URL: http://shared-skill-knowledge:8005
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: nginx:1.28-alpine
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:80"
    environment:
      - LEARNING_SERVICE_PORT=${LEARNING_SERVICE_PORT:?Set LEARNING_SERVICE_PORT in infrastructure/.env}
      - INTERVIEW_SERVICE_PORT=${INTERVIEW_SERVICE_PORT:?Set INTERVIEW_SERVICE_PORT in infrastructure/.env}
      - SHARED_SKILL_KNOWLEDGE_PORT=${SHARED_SKILL_KNOWLEDGE_PORT:-8005}
      - JOB_MARKET_INTELLIGENCE_PORT=${JOB_MARKET_INTELLIGENCE_PORT:-8003}
      - READINESS_ENGINE_PORT=${READINESS_ENGINE_PORT:-8010}
      - NGINX_ENVSUBST_FILTER=LEARNING_SERVICE_PORT|INTERVIEW_SERVICE_PORT|SHARED_SKILL_KNOWLEDGE_PORT|JOB_MARKET_INTELLIGENCE_PORT|READINESS_ENGINE_PORT
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - auth-service
      - shared-skill-knowledge
      - job-market-intelligence-engine
      - learning-service
      - interview-service
      - readiness-engine

volumes:
  postgres-data:

